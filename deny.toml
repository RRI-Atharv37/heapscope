[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2

[licenses]
version = 2
# Permissive licences only, so everything can be combined with a GPL-3.0 core.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
