[package]
name = "heapscope-cli"
description = "HeapScope command-line profiler for Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "heapscope"
path = "src/main.rs"

[dependencies]
clap.workspace = true
heapscope-analysis = { path = "../heapscope-analysis" }
heapscope-control = { path = "../heapscope-control" }
heapscope-symbols = { path = "../heapscope-symbols" }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
heapscope-trace = { path = "../heapscope-trace" }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
