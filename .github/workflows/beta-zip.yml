name: beta-zip

# Builds heapscope-<version>.zip on a GitHub runner (no Smart App Control there). Run it by hand
# from the Actions tab, or push a tag like v0.1.0-beta to also attach the zip to a pre-release.
# The SHA-256 is printed in the job summary: it goes into the CI templates (HEAPSCOPE_SHA256).
# No cache on purpose: this builds what gets shipped.
on:
  workflow_dispatch:   # tags are handled by release.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: report/package-lock.json
      - name: Report template is up to date
        working-directory: report
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../crates/heapscope-report/assets/report-template.html
      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0-beta' }
          ./scripts/package-beta.ps1 -Version $version
          $zip = Get-ChildItem build/dist -Filter *.zip | Select-Object -First 1
          "ZIP=$($zip.FullName)" >> $env:GITHUB_ENV
          "### $($zip.Name)`nSHA-256: ``$((Get-FileHash $zip.FullName -Algorithm SHA256).Hash)``" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: heapscope-zip
          path: ${{ env.ZIP }}
      - name: Attach to a pre-release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME $env:ZIP --prerelease --title $env:GITHUB_REF_NAME --notes-file CHANGELOG.md
