name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Caching is for CI only. The signed release build (release.yml, S4.4) must not cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The report page is built from report/ and committed, so Rust builds need no Node. This
      # fails when the two disagree.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: report/package-lock.json
      - name: Report template is up to date
        working-directory: report
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --exit-code -- ../crates/heapscope-report/assets/report-template.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The capture tests run the real CLI on the sample programs, so build those first.
      - name: Build samples (CMake)
        run: |
          cmake -S samples -B build/samples
          cmake --build build/samples --config RelWithDebInfo
      # `cargo test` does not build the capture DLL (a cdylib), and the capture tests need it
      # next to heapscope.exe.
      - name: Build the CLI and capture DLL
        run: cargo build --workspace --locked
      - name: Test (includes `heapscope run`/`attach` and the ground-truth e2e suite on the samples)
        env:
          HEAPSCOPE_REQUIRE_SAMPLES: "1"
        run: cargo test --workspace --locked
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
